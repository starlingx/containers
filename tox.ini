[tox]
envlist = linters
minversion = 2.3
skipsdist = True
sitepackages=False

[testenv]
install_command = pip install -U {opts} {packages}
setenv =
   VIRTUAL_ENV={envdir}
   OS_STDOUT_CAPTURE=1
   OS_STDERR_CAPTURE=1
   OS_DEBUG=1
   OS_LOG_CAPTURE=1
deps =
  -r{toxinidir}/requirements.txt
  -r{toxinidir}/test-requirements.txt
allowlist_externals =
  bash

[testenv:bashate]
# Treat all E* codes as Errors rather than warnings using: -e 'E*'
commands =
  bash -c "find {toxinidir}                    \
         -not \( -type d -name .?\* -prune \) \
         -type f                              \
         -not -name \*~                       \
         -not -name \*.md                     \
         -name \*.sh                          \
         -print0 | xargs -r -n 1 -0 bashate -v   \
         -e 'E*'"

[testenv:flake8]
commands =
  flake8

[testenv:linters]
commands =
    {[testenv:bashate]commands}

[testenv:coverage-go]
# Go-only project: runs tests with coverage, generates text + HTML reports
allowlist_externals =
  bash
  go
  mkdir
setenv =
  {[testenv]setenv}
  GOCACHE={toxinidir}/.tox/.gocache
  GOPATH={toxinidir}/.tox/.gopath
  HOME={toxinidir}/.tox
commands =
  bash -c "mkdir -p {toxinidir}/UTCoverage && \
    cd {toxinidir}/registry-token-server/src && \
    go mod vendor 2>/dev/null && \
    go test -mod=vendor -v -coverprofile={toxinidir}/UTCoverage/coverage.out -covermode=atomic -count=1 ./... 2>&1 | \
    tee {toxinidir}/UTCoverage/coverage_report.txt && \
    go tool cover -func={toxinidir}/UTCoverage/coverage.out 2>&1 | \
    tee -a {toxinidir}/UTCoverage/coverage_report.txt && \
    go tool cover -html={toxinidir}/UTCoverage/coverage.out \
    -o {toxinidir}/UTCoverage/coverage.html 2>/dev/null"

[testenv:security]
# Security scanning with go vet and gosec
allowlist_externals =
  bash
  go
  mkdir
setenv =
  {[testenv]setenv}
  GOCACHE={toxinidir}/.tox/.gocache
  GOPATH={toxinidir}/.tox/.gopath
  HOME={toxinidir}/.tox
commands =
  bash -c "mkdir -p {toxinidir}/UTCoverage && \
    echo '=== Go Vet Security Analysis ===' > {toxinidir}/UTCoverage/security_report.txt && \
    cd {toxinidir}/registry-token-server/src && \
    go mod vendor 2>/dev/null && \
    go vet -mod=vendor ./... 2>&1 | tee -a {toxinidir}/UTCoverage/security_report.txt && \
    echo '' >> {toxinidir}/UTCoverage/security_report.txt && \
    echo '=== Gosec Vulnerability Scan ===' >> {toxinidir}/UTCoverage/security_report.txt && \
    go install github.com/securego/gosec/v2/cmd/gosec@latest 2>/dev/null && \
    {toxinidir}/.tox/.gopath/bin/gosec -exclude-dir=vendor ./... 2>&1 | tee -a {toxinidir}/UTCoverage/security_report.txt && \
    echo '' >> {toxinidir}/UTCoverage/security_report.txt && \
    echo '=== Security Analysis Summary ===' >> {toxinidir}/UTCoverage/security_report.txt && \
    echo 'go vet and gosec completed successfully' >> {toxinidir}/UTCoverage/security_report.txt"

[trixie]
basepython = python3.13
setenv =
  {[testenv]setenv}
  UPPER_CONSTRAINTS_FILE=https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/trixie/upper-constraints.txt
install_command = pip install -c{env:UPPER_CONSTRAINTS_FILE} -U {opts} {packages}
deps =
  -r{toxinidir}/requirements.txt
  -r{toxinidir}/test-requirements-trixie.txt

[testenv:linters-trixie]
basepython = {[trixie]basepython}
setenv = {[trixie]setenv}
install_command = {[trixie]install_command}
deps = {[trixie]deps}
allowlist_externals = {[testenv]allowlist_externals}
commands = {[testenv:linters]commands}

[testenv:coverage-go-trixie]
basepython = {[trixie]basepython}
setenv =
  {[trixie]setenv}
  GOCACHE={toxinidir}/.tox/.gocache
  GOPATH={toxinidir}/.tox/.gopath
  HOME={toxinidir}/.tox
install_command = {[trixie]install_command}
deps = {[trixie]deps}
allowlist_externals =
  bash
  go
  mkdir
commands = {[testenv:coverage-go]commands}

[testenv:security-trixie]
basepython = {[trixie]basepython}
setenv =
  {[trixie]setenv}
  GOCACHE={toxinidir}/.tox/.gocache
  GOPATH={toxinidir}/.tox/.gopath
  HOME={toxinidir}/.tox
install_command = {[trixie]install_command}
deps = {[trixie]deps}
allowlist_externals =
  bash
  go
  mkdir
commands = {[testenv:security]commands}
